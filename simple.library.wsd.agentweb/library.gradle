/*
 * AgentWeb 浏览器的资源命名空间和 AndroidX 依赖。
 */
android {
	// 本库资源独立于上游 AgentWeb 与应用资源。
	namespace = 'simple.library.wsd.agentweb'
}

dependencies {
	// 核心与下载交给 SDK 解析；文件选择使用本库的普通 Activity 适配。
	implementation 'com.github.Justson.AgentWeb:agentweb-core:v5.0.6-androidx'
	implementation 'com.github.Justson:Downloader:v5.0.4-androidx'
	// 上游以 compileOnly 声明的运行条件，必须由消费方明确补齐。
	implementation 'androidx.appcompat:appcompat:1.3.1'
	implementation 'androidx.legacy:legacy-support-v4:1.0.0'
	implementation 'com.google.android.material:material:1.4.0'
}

<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgentWeb 本地测试</title>
<style>body{font:16px sans-serif;margin:16px;color:#17243d}button,a,input{font:inherit;margin:5px 0;padding:10px;display:block}button{width:100%;border:1px solid #cbd8ef;background:#eef4ff;border-radius:6px}video{width:100%;background:#10294b}#result{background:#e8f5e9;padding:8px;overflow-wrap:anywhere}h2{font-size:18px}</style>
<h2>独立网页交互</h2><p>本地内容无需网络。上传测试请选择文件，网页会读取所选内容。</p>
<div id="result">等待交互</div><p>计数：<span id="ticks">0</span></p>
<button onclick="ES4A.postMessage('PING')">网页消息 PING</button>
<a href="agentweb_page2.html">前往第二页</a><a href="https://blocked.example/">应被拦截的导航</a>
<label>单文件上传<input id="single" type="file" accept="text/plain" onchange="showFiles(this)"></label>
<label>多文件上传<input id="multiple" type="file" multiple onchange="showFiles(this)"></label>
<h2>本地视频</h2><video id="video" controls playsinline src="agentweb_video.webm"></video>
<button onclick="document.getElementById('video').play();document.getElementById('video').requestFullscreen()">播放并全屏</button>
<h2>原生能力检查</h2><a href="http://127.0.0.1:18764/download.txt">网页附件下载</a>
<button onclick="ES4A.postMessage('COOKIE')">写入 Cookie</button><button onclick="ES4A.postMessage('CLEAR_COOKIE')">清除 Cookie</button>
<button onclick="ES4A.postMessage('CACHE')">缓存与 UserAgent 检查</button>
<button onclick="ES4A.postMessage('DOWNLOAD')">下载本机测试文件</button><button onclick="ES4A.postMessage('DOWNLOAD_ERROR')">下载失败检查</button><button onclick="ES4A.postMessage('SLOW')">开始慢速下载</button><button onclick="ES4A.postMessage('CANCEL')">取消慢速下载</button>
<button onclick="ES4A.postMessage('HTTP_ERROR')">HTTP 404 检查</button><button onclick="ES4A.postMessage('NETWORK_ERROR')">网络失败检查</button>
<button onclick="ES4A.postMessage('SWITCH')">切换窗口与双实例</button><button onclick="ES4A.postMessage('HTML')">加载 HTML 检查</button>
<button onclick="ES4A.postMessage('INVALID')">非法缓存参数检查</button>
<script>
var ticks=0;setInterval(function(){document.getElementById('ticks').textContent=++ticks},1000);
function showFiles(input){var list=Array.from(input.files);document.getElementById('result').textContent='文件数='+list.length+' '+list.map(function(f){return f.name}).join(',');if(list.length){var reader=new FileReader();reader.onload=function(){document.getElementById('result').textContent+=' 内容='+reader.result;ES4A.postMessage('FILE:'+reader.result)};reader.readAsText(list[0]);if(location.protocol==='http:'){var form=new FormData();list.forEach(function(f){form.append('file',f)});fetch('/upload',{method:'POST',body:form}).then(function(r){return r.text()}).then(function(t){ES4A.postMessage('UPLOAD:'+t)})}}}
</script></html>

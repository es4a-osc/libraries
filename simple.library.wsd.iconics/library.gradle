android { namespace = 'simple.library.wsd.iconics' }
dependencies {
 implementation 'androidx.appcompat:appcompat:1.3.1'
 implementation 'androidx.core:core-ktx:1.6.0'
 implementation 'androidx.startup:startup-runtime:1.0.0'
 implementation 'com.mikepenz:iconics-core:5.3.0'
 implementation 'com.mikepenz:iconics-views:5.3.0'
 implementation 'com.mikepenz:google-material-typeface:4.0.0.2-kotlin'
 def fonts = ['material-design-iconic-typeface':'2.2.0.8-kotlin', 'fontawesome-typeface':'5.9.0.2-kotlin', 'octicons-typeface':'11.1.0.0-kotlin', 'meteocons-typeface':'1.1.0.7-kotlin', 'community-material-typeface':'5.8.55.0-kotlin', 'weather-icons-typeface':'2.0.10.7-kotlin', 'typeicons-typeface':'2.0.7.7-kotlin', 'entypo-typeface':'1.0.0.7-kotlin', 'devicon-typeface':'2.0.0.7-kotlin', 'foundation-icons-typeface':'3.0.0.7-kotlin', 'ionicons-typeface':'2.0.1.7-kotlin', 'pixeden-7-stroke-typeface':'1.2.0.5-kotlin', 'material-design-icons-dx-typeface':'5.0.1.2-kotlin', 'phosphor-typeface':'1.0.0.0-kotlin']
 fonts.each { artifact, version -> implementation "com.mikepenz:${artifact}:${version}" }
 // 原始 AAR 用于避开上游三个变体缺失的 Gradle 元数据。
 implementation fileTree(dir:'aars', include:['*.aar'])
}

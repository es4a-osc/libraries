/* 一个 ES4A 扩展库交付 XUpdate 与 XUpdateAPI；内部保留各自的包名和职责。 */
android {
	// 资源命名空间统一；Java 中的核心与便捷适配仍按包区分。
	namespace = 'simple.library.wsd.xupdate'
}

dependencies {
	implementation 'com.github.xuexiangjys:XUpdate:2.1.5'
	implementation('com.github.xuexiangjys.XUpdateAPI:xupdate-easy:1.0.1') {
		exclude group: 'com.zhy', module: 'okhttputils'
	}
	implementation('com.github.xuexiangjys.XUpdateAPI:xupdate-downloader-aria:1.0.1') {
		exclude group: 'com.arialyy.aria'
	}
	// 旧仓库的原始本地包位于 aars/、libs/，继续沿用已经验证的版本。
	implementation 'com.google.code.gson:gson:2.8.5'
	implementation 'com.squareup.okhttp3:okhttp:3.12.12'
	implementation 'androidx.appcompat:appcompat:1.3.1'
}
